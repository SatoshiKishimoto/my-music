<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1224"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Music</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header><div class="brand"><span class="brand-mark">♫</span><div><small>PERSONAL PLAYER</small><h1>My Music</h1></div></div><span class="status">PRIVATE</span></header>
<section class="player" aria-label="音楽プレーヤー">
<div class="art" id="art"><span>♫</span></div><div class="song-meta"><div class="eyebrow" id="sourceLabel">READY TO PLAY</div><h2 id="trackTitle">曲を選択してください</h2><p id="trackSubtitle">MP3 / WAV</p></div>
<div class="timeline"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置"><div class="time"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div>
<div class="controls"><button id="shuffle" class="secondary" aria-label="シャッフル" title="シャッフル">⇄</button><button id="prev" aria-label="前の曲">⏮</button><button id="play" class="play" aria-label="再生">▶</button><button id="next" aria-label="次の曲">⏭</button><button id="repeat" class="secondary" aria-label="リピート" title="リピート">↻</button></div>
<div class="volume"><span>♪</span><input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量"><span>♫</span></div>
</section>
<section class="library"><div class="section-title"><h3>ライブラリ</h3><span id="count">0 曲</span></div><div class="add-actions"><button id="chooseFiles" class="primary-action">＋ ファイルから追加</button><button id="showUrl" class="outline-action">＋ URLから追加</button></div><input id="fileInput" type="file" accept="audio/*,video/mp4,video/quicktime,.mp3,.wav,.m4a,.aac,.ogg,.flac,.mp4,.m4v,.mov" multiple hidden>
<form id="urlForm" class="url-form" hidden><label for="urlInput">音楽ファイルの直接URL（https://...mp3 など）</label><input id="urlInput" type="url" placeholder="https://example.com/music.mp3" required><input id="nameInput" type="text" placeholder="曲名（省略可）"><button type="submit">ライブラリに登録</button></form>
<div class="list-head"><span>曲一覧</span><button id="clearLocal" class="text-button">保存した曲を全削除</button></div><ul id="tracks" class="tracks"><li class="empty">曲がありません。ファイルまたはURLから追加してください。</li></ul>
</section><p class="notice">追加した曲はこのiPhoneのアプリ内に保存され、次回から選び直す必要はありません（サーバーへはアップロードされません）。</p>
</main><div id="toast" role="status" aria-live="polite"></div><audio id="audio" preload="metadata"></audio><script src="app.js"></script>
</body></html>
